<!DOCTYPE html>
<html lang="en">
<head>
	<link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="../favicon/favicon-16x16.png">
	<link rel="manifest" href="/favicon/site.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ Checklist</title>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f5f7fa;
            --text: #111111;
            --text-secondary: #1a1a1a;
            --blue-deep: #0b1d3a;
            --blue-primary: #1a3d6d;
            --blue-accent: #1e5ab5;
            --blue-bright: #2979ff;
            --blue-light: #dce8f8;
            --border: #1a1a1a;
            --border-light: #cccccc;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.2);
            --radius: 10px;
            --radius-sm: 6px;
            --transition: 0.2s ease;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --card-width: 300px;
            --card-bg: #ffffff;
            --card-header-bg: #f8f9fb;
            --task-item-bg: #fafbfc;
            --task-item-hover-bg: #f0f3f6;
            --modal-bg: #ffffff;
            --modal-text: #111;
            --input-bg: #fff;
            --input-border: #d5d8dd;
            --delete-btn-color: #999;
            --delete-btn-hover-bg: #fde8e8;
            --delete-btn-hover-color: #c62828;
            --btn-ghost-bg-hover: #e8e8e8;
            --btn-ghost-text: #555;
            --frequency-border: #e0e0e0;
            --toast-bg: #111;
            --toast-text: #fff;
            --settings-cog-bg: var(--blue-deep);
            --settings-cog-border: #fff;
            --header-bg: var(--blue-deep);
            --header-text: #fff;
            --task-text-color: #1a1a1a;
            --task-text-completed: #666;
            --add-row-bg: #fafbfc;
            --empty-text: #777;
            --badge-bg: #fff;
            --badge-text: var(--blue-primary);
            --btn-outline-text: #fff;
            --btn-outline-border: rgba(255, 255, 255, 0.6);
            --btn-outline-hover-bg: rgba(255, 255, 255, 0.1);
            --btn-outline-hover-border: #fff;
            --danger-btn-bg: #c62828;
            --danger-btn-border: #c62828;
            --danger-btn-hover-bg: #b71c1c;
            --drop-indicator-color: #2979ff;
            --drop-height: 8px;
        }

        .dark-mode {
            --bg: #12151c;
            --surface: #1e222a;
            --text: #e0e0e0;
            --text-secondary: #c0c0c0;
            --blue-deep: #0a1526;
            --blue-primary: #1b3458;
            --blue-accent: #2a6dd4;
            --blue-bright: #448aff;
            --blue-light: #25344a;
            --border: #444;
            --border-light: #555;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.8);
            --card-bg: #262b33;
            --card-header-bg: #2f343d;
            --task-item-bg: #2f343d;
            --task-item-hover-bg: #3a404a;
            --modal-bg: #2a2f38;
            --modal-text: #e0e0e0;
            --input-bg: #1e222a;
            --input-border: #555;
            --delete-btn-color: #aaa;
            --delete-btn-hover-bg: #5c2a2a;
            --delete-btn-hover-color: #ff7b7b;
            --btn-ghost-bg-hover: #3a3f48;
            --btn-ghost-text: #ccc;
            --frequency-border: #444;
            --toast-bg: #e0e0e0;
            --toast-text: #111;
            --settings-cog-bg: #1b3458;
            --settings-cog-border: #ddd;
            --header-bg: #0a1526;
            --header-text: #fff;
            --task-text-color: #e0e0e0;
            --task-text-completed: #aaa;
            --add-row-bg: #2f343d;
            --empty-text: #aaa;
            --badge-bg: #1b3458;
            --badge-text: #fff;
            --btn-outline-text: #ddd;
            --btn-outline-border: rgba(255, 255, 255, 0.4);
            --btn-outline-hover-bg: rgba(255, 255, 255, 0.15);
            --btn-outline-hover-border: #fff;
            --danger-btn-bg: #b71c1c;
            --danger-btn-border: #ff8a80;
            --danger-btn-hover-bg: #c62828;
            --drop-indicator-color: #448aff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .app-header {
            background: var(--header-bg);
            color: var(--header-text);
            padding: 18px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.25);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .app-header h1 { font-size: 1.6rem; font-weight: 700; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 10px 18px;
            border: 2px solid transparent;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            white-space: nowrap;
        }
        .btn-primary { background: var(--blue-bright); color: #fff; border-color: var(--blue-bright); }
        .btn-primary:hover { background: #1c6ee0; }
        .btn-outline { background: transparent; color: var(--btn-outline-text); border-color: var(--btn-outline-border); }
        .btn-outline:hover { background: var(--btn-outline-hover-bg); }
        .btn-sm { padding: 6px 12px; font-size: 0.82rem; }
        .btn-danger { background: var(--danger-btn-bg); color: #fff; border-color: var(--danger-btn-border); }
        .btn-danger:hover { background: var(--danger-btn-hover-bg); }
        .btn-ghost { background: transparent; color: var(--btn-ghost-text); border-color: transparent; }
        .btn-ghost:hover { background: var(--btn-ghost-bg-hover); color: var(--text); }

        .main-container { max-width: 100%; padding: 20px 24px 100px 24px; }
        .frequency-section {
            margin-bottom: 32px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 2px solid var(--frequency-border);
        }
        .frequency-header {
            background: var(--blue-primary);
            color: #fff;
            padding: 13px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            border-bottom: 3px solid var(--blue-deep);
        }
        .frequency-header h2 {
            font-size: 1.15rem;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge {
            background: var(--badge-bg);
            color: var(--badge-text);
            font-size: 0.78rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
        }
        .categories-row {
            display: flex;
            gap: 16px;
            padding: 16px 20px;
            overflow-x: auto;
            min-height: 120px;
            align-items: flex-start;
        }

        .category-card {
            flex: 0 0 var(--card-width);
            width: var(--card-width);
            background: var(--card-bg);
            border: 2px solid var(--border-light);
            border-radius: var(--radius);
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            max-height: 460px;
            transition: var(--transition);
        }
        .category-card.dragging { opacity: 0.4; }

        .card-header {
            background: var(--card-header-bg);
            padding: 11px 14px;
            border-bottom: 2px solid #e2e5ea;
            display: flex;
            align-items: center;
            gap: 6px;
            border-radius: var(--radius) var(--radius) 0 0;
            cursor: grab;
        }
        .card-header:active { cursor: grabbing; }
        .card-header .cat-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--delete-btn-color);
            font-size: 1.1rem;
            line-height: 1;
            padding: 2px 5px;
            border-radius: 4px;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .icon-btn:hover {
            color: var(--delete-btn-hover-color);
            background: var(--delete-btn-hover-bg);
        }
        .icon-btn.save-active { color: #2e7d32; }
        .icon-btn.save-active:hover { color: #1b5e20; background: #e8f5e9; }

        .task-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 40px;
            max-height: 270px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 4px;
            border-radius: var(--radius-sm);
            background: var(--task-item-bg);
            border: 1px solid transparent;
            transition: var(--transition);
            cursor: grab;
        }
        .task-item:active { cursor: grabbing; }
        .task-item:hover { background: var(--task-item-hover-bg); border-color: #dde1e6; }
        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--task-text-completed);
        }
        .task-item.dragging { opacity: 0.4; }
        .task-item.drop-target-above {
            border-top: var(--drop-height) solid var(--drop-indicator-color);
        }
        .task-item.drop-target-below {
            border-bottom: var(--drop-height) solid var(--drop-indicator-color);
        }

        .drag-handle {
            font-size: 1.1rem;
            color: #bbb;
            padding: 0 6px;
            flex-shrink: 0;
            pointer-events: none;
        }
        .task-checkbox {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            accent-color: var(--blue-accent);
        }
        .task-text { flex: 1; font-size: 0.9rem; color: var(--task-text-color); word-break: break-word; }

        .edit-input {
            flex: 1;
            padding: 4px 6px;
            border: 2px solid var(--blue-bright);
            border-radius: 4px;
            font-size: 0.9rem;
            font-family: var(--font);
            background: var(--input-bg);
            color: var(--text);
        }

        .add-task-row {
            display: flex;
            gap: 6px;
            padding: 10px 12px;
            border-top: 2px solid #e8ebef;
            background: var(--add-row-bg);
            border-radius: 0 0 var(--radius) var(--radius);
        }
        .add-task-row input {
            flex: 1;
            padding: 8px 10px;
            border: 2px solid var(--input-border);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-family: var(--font);
            background: var(--input-bg);
            color: var(--text);
        }
        .add-task-row button {
            padding: 8px 13px;
            background: var(--blue-accent);
            color: #fff;
            border: 2px solid var(--blue-accent);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.83rem;
        }

        .settings-cog-wrapper { position: fixed; bottom: 24px; right: 24px; z-index: 200; }
        .settings-cog-btn {
            width: 52px; height: 52px; border-radius: 50%;
            background: var(--settings-cog-bg); color: #fff;
            border: 3px solid var(--settings-cog-border);
            box-shadow: var(--shadow-lg); cursor: pointer;
            font-size: 1.6rem; display: flex; align-items: center; justify-content: center;
        }
        .settings-cog-btn:hover { background: #0f2747; }

        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            z-index: 300; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--modal-bg); border-radius: var(--radius);
            box-shadow: var(--shadow-lg); padding: 28px 26px 22px;
            max-width: 500px; width: 100%; max-height: 85vh; overflow-y: auto;
            border: 2px solid var(--border); position: relative; color: var(--modal-text);
        }
        .modal h3 {
            font-size: 1.25rem;
            margin-bottom: 18px;
            font-weight: 700;
            text-align: center;
        }
        .modal .form-group { margin-bottom: 16px; }
        .modal label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; }
        .modal input[type="text"], .modal select {
            width: 100%; padding: 10px 12px; border: 2px solid var(--input-border);
            border-radius: var(--radius-sm); font-size: 0.95rem;
            font-family: var(--font); background: var(--input-bg); color: var(--text);
        }
        .modal .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
            justify-content: center;
        }
        .modal .divider { border: none; border-top: 2px solid var(--border-light); margin: 18px 0; }
        .modal .settings-section { margin-bottom: 14px; }
        .modal .settings-section h4 {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-align: center;
        }
        .reset-btn-group, .clear-btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .reset-btn-group button, .clear-btn-group button {
            flex: 1 1 auto;
            min-width: 100px;
            padding: 9px 14px;
            border: 2px solid #333;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            background: var(--card-bg);
            color: var(--text);
        }
        .reset-daily { border-color: #1a3d6d; color: #1a3d6d; }
        .reset-weekly { border-color: #1e5ab5; color: #1e5ab5; }
        .reset-monthly { border-color: #2979ff; color: #2979ff; }
        .reset-yearly { border-color: #5a9cff; color: #3b7ddd; }
        .reset-btn-group button:hover { color: #fff; }
        .reset-daily:hover { background: #1a3d6d; }
        .reset-weekly:hover { background: #1e5ab5; }
        .reset-monthly:hover { background: #2979ff; }
        .reset-yearly:hover { background: #5a9cff; }
        .clear-btn { border-color: #c62828; color: #c62828; }
        .clear-btn:hover { background: #c62828; color: #fff; }
        .clear-all-btn {
            background: #b71c1c;
            color: #fff;
            border-color: #b71c1c;
            width: 100%;
            margin-top: 4px;
            text-align: center;
            justify-content: center;
        }
        .dark-mode-toggle-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 8px 0 12px;
        }
        .dark-mode-toggle-row label {
            margin-bottom: 0;
            cursor: pointer;
        }
        .dark-mode-toggle-row input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--blue-bright);
        }
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--toast-bg); color: var(--toast-text);
            padding: 12px 22px; border-radius: 30px; font-weight: 600;
            font-size: 0.9rem; z-index: 400; box-shadow: var(--shadow-lg);
            opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
        }
        .toast.show { opacity: 1; pointer-events: auto; }
        .empty-group {
            padding: 28px 20px; text-align: center; color: var(--empty-text);
            font-style: italic; font-size: 0.9rem; min-height: 80px;
            display: flex; align-items: center; justify-content: center;
        }
        .close-modal-btn { position: absolute; top: 12px; right: 14px; }
    </style>
</head>
<body>
    <div class="main-container" id="mainContainer">
        <section class="frequency-section" id="section-daily">
            <div class="frequency-header"><h2>📋 Daily <span class="badge" id="badge-daily">0</span></h2><button class="btn btn-outline btn-sm" onclick="openAddCategoryWithFreq('daily')">＋ Add</button></div>
            <div class="categories-row" id="row-daily"></div><div class="empty-group" id="empty-daily" style="display:none;">No daily categories yet.</div>
        </section>
        <section class="frequency-section" id="section-weekly">
            <div class="frequency-header"><h2>📋 Weekly <span class="badge" id="badge-weekly">0</span></h2><button class="btn btn-outline btn-sm" onclick="openAddCategoryWithFreq('weekly')">＋ Add</button></div>
            <div class="categories-row" id="row-weekly"></div><div class="empty-group" id="empty-weekly" style="display:none;">No weekly categories yet.</div>
        </section>
        <section class="frequency-section" id="section-monthly">
            <div class="frequency-header"><h2>📋 Monthly <span class="badge" id="badge-monthly">0</span></h2><button class="btn btn-outline btn-sm" onclick="openAddCategoryWithFreq('monthly')">＋ Add</button></div>
            <div class="categories-row" id="row-monthly"></div><div class="empty-group" id="empty-monthly" style="display:none;">No monthly categories yet.</div>
        </section>
        <section class="frequency-section" id="section-yearly">
            <div class="frequency-header"><h2>📋 Yearly <span class="badge" id="badge-yearly">0</span></h2><button class="btn btn-outline btn-sm" onclick="openAddCategoryWithFreq('yearly')">＋ Add</button></div>
            <div class="categories-row" id="row-yearly"></div><div class="empty-group" id="empty-yearly" style="display:none;">No yearly categories yet.</div>
        </section>
    </div>

    <div class="settings-cog-wrapper"><button class="settings-cog-btn" onclick="openSettingsModal()">⚙️</button></div>

    <div class="modal-overlay" id="addCategoryModalOverlay">
        <div class="modal">
            <button class="icon-btn close-modal-btn" onclick="closeAddCategoryModal()">✕</button>
            <h3>Create New Category</h3>
            <div class="form-group"><label>Category Name</label><input type="text" id="catNameInput" placeholder="e.g., Morning Routine"></div>
            <div class="form-group"><label>Frequency</label><select id="catFrequencySelect"><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></div>
            <div class="btn-row"><button class="btn btn-primary" onclick="confirmAddCategory()">✅ Create</button><button class="btn btn-ghost" onclick="closeAddCategoryModal()">Cancel</button></div>
        </div>
    </div>

    <div class="modal-overlay" id="settingsModalOverlay">
        <div class="modal">
            <button class="icon-btn close-modal-btn" onclick="closeSettingsModal()">✕</button>
            <h3>⚙️ Settings</h3>
            <div class="dark-mode-toggle-row">
                <label for="darkModeCheckbox">🌙 Dark Mode</label>
                <input type="checkbox" id="darkModeCheckbox" onchange="toggleDarkMode(this.checked)">
            </div>
            <div class="settings-section"><h4>🔄 Reset Completion</h4><div class="reset-btn-group">
                <button class="reset-daily" onclick="resetByFrequency('daily')">Reset Daily</button>
                <button class="reset-weekly" onclick="resetByFrequency('weekly')">Reset Weekly</button>
                <button class="reset-monthly" onclick="resetByFrequency('monthly')">Reset Monthly</button>
                <button class="reset-yearly" onclick="resetByFrequency('yearly')">Reset Yearly</button>
            </div></div>
            <hr class="divider">
            <div class="settings-section"><h4>🗑️ Clear Categories</h4><div class="clear-btn-group">
                <button class="clear-btn" onclick="clearFrequency('daily')">Clear Daily</button>
                <button class="clear-btn" onclick="clearFrequency('weekly')">Clear Weekly</button>
                <button class="clear-btn" onclick="clearFrequency('monthly')">Clear Monthly</button>
                <button class="clear-btn" onclick="clearFrequency('yearly')">Clear Yearly</button>
            </div><button class="btn btn-danger clear-all-btn" onclick="clearAllData()">⚠️ Clear EVERYTHING</button></div>
            <hr class="divider">
            <div class="settings-section"><h4>💾 Backup / Restore</h4><div class="btn-row">
                <button class="btn btn-primary btn-sm" onclick="backupData()">📥 Download Backup</button>
                <button class="btn btn-primary btn-sm" onclick="document.getElementById('restoreFileInput').click()">📤 Restore Backup</button>
            </div><input type="file" id="restoreFileInput" accept=".json" onchange="restoreData(event)" style="display:none;"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            const STORAGE_KEY = 'checklist_app_final';
            const DARK_MODE_KEY = 'checklist_dark_mode';
            const frequencies = ['daily', 'weekly', 'monthly', 'yearly'];
            let appData = { categories: [] };
            let dragInfo = null;

            const genId = () => `id_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
            const toastEl = document.getElementById('toast');
            const showToast = (msg, dur = 2200) => {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(toastEl._t);
                toastEl._t = setTimeout(() => toastEl.classList.remove('show'), dur);
            };

            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (parsed?.categories) {
                            appData = parsed;
                            appData.categories = appData.categories.filter(c => c && c.id && c.name && c.frequency && Array.isArray(c.tasks));
                            appData.categories.forEach(c => {
                                c.tasks = c.tasks.filter(t => t && t.id && typeof t.text === 'string' && typeof t.completed === 'boolean');
                            });
                        }
                    }
                } catch (e) { appData = { categories: [] }; }
                document.cookie = `checklist_app_data=true; max-age=31536000; path=/; SameSite=Lax`;
            }

            function saveData() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
                document.cookie = `checklist_app_data=true; max-age=31536000; path=/; SameSite=Lax`;
            }

            function getCategoriesByFrequency(freq) {
                return appData.categories.filter(c => c.frequency === freq);
            }

            function renderAll() { frequencies.forEach(f => renderFrequencyGroup(f)); }

            function renderFrequencyGroup(freq) {
                const row = document.getElementById('row-' + freq);
                const empty = document.getElementById('empty-' + freq);
                const badge = document.getElementById('badge-' + freq);
                const cats = getCategoriesByFrequency(freq);
                badge.textContent = `${cats.length} ${cats.length === 1 ? 'category' : 'categories'}`;
                row.innerHTML = '';
                if (cats.length === 0) {
                    empty.style.display = 'flex';
                    row.style.display = 'none';
                } else {
                    empty.style.display = 'none';
                    row.style.display = 'flex';
                    cats.forEach(c => row.appendChild(createCategoryCard(c)));
                }
            }

            function createCategoryCard(cat) {
                const card = document.createElement('div');
                card.className = 'category-card';
                card.setAttribute('data-category-id', cat.id);

                const header = document.createElement('div');
                header.className = 'card-header';
                header.draggable = true;
                header.addEventListener('dragstart', e => {
                    if (e.target.closest('button, input, textarea, select')) { e.preventDefault(); return; }
                    dragInfo = { type: 'category', categoryId: cat.id, frequency: cat.frequency };
                    e.dataTransfer.setData('text/plain', 'category');
                    e.dataTransfer.effectAllowed = 'move';
                    card.classList.add('dragging');
                });
                header.addEventListener('dragend', () => { card.classList.remove('dragging'); dragInfo = null; });

                const nameSpan = document.createElement('span');
                nameSpan.className = 'cat-name';
                nameSpan.textContent = cat.name;
                nameSpan.title = 'Drag header to reorder';

                const editBtn = document.createElement('button');
                editBtn.className = 'icon-btn';
                editBtn.innerHTML = '✎';
                editBtn.title = 'Edit name';
                const delBtn = document.createElement('button');
                delBtn.className = 'icon-btn';
                delBtn.innerHTML = '✕';
                delBtn.title = 'Delete category';

                let editing = false;
                editBtn.addEventListener('click', e => {
                    e.stopPropagation();
                    if (editing) {
                        const input = header.querySelector('.edit-input');
                        if (input) {
                            const val = input.value.trim();
                            if (val) cat.name = val;
                            header.replaceChild(nameSpan, input);
                            nameSpan.textContent = cat.name || '(untitled)';
                            saveData();
                        }
                        editBtn.innerHTML = '✎';
                        editBtn.classList.remove('save-active');
                        editing = false;
                    } else {
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'edit-input';
                        input.value = cat.name;
                        input.style.maxWidth = '80%';
                        header.replaceChild(input, nameSpan);
                        input.focus();
                        editBtn.innerHTML = '💾';
                        editBtn.classList.add('save-active');
                        editing = true;
                        const saveFn = () => {
                            if (editing) {
                                const val = input.value.trim();
                                if (val) cat.name = val;
                                header.replaceChild(nameSpan, input);
                                nameSpan.textContent = cat.name || '(untitled)';
                                editBtn.innerHTML = '✎';
                                editBtn.classList.remove('save-active');
                                editing = false;
                                saveData();
                            }
                        };
                        input.addEventListener('blur', () => setTimeout(saveFn, 150));
                        input.addEventListener('keydown', ev => {
                            if (ev.key === 'Enter') input.blur();
                            if (ev.key === 'Escape') { input.value = cat.name; input.blur(); }
                        });
                    }
                });
                delBtn.addEventListener('click', e => { e.stopPropagation(); deleteCategory(cat.id); });

                header.appendChild(nameSpan);
                header.appendChild(editBtn);
                header.appendChild(delBtn);

                const taskList = document.createElement('ul');
                taskList.className = 'task-list';
                taskList.setAttribute('data-category-id', cat.id);
                if (cat.tasks.length === 0) {
                    taskList.innerHTML = '<li class="no-tasks">No tasks yet</li>';
                } else {
                    cat.tasks.forEach(task => taskList.appendChild(createTaskItem(cat.id, task)));
                }

                const addRow = document.createElement('div');
                addRow.className = 'add-task-row';
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = 'New task...';
                input.maxLength = 150;
                const addBtn = document.createElement('button');
                addBtn.textContent = 'Add';
                const addTaskFn = () => {
                    const text = input.value.trim();
                    if (text) { addTask(cat.id, text); input.value = ''; }
                };
                addBtn.addEventListener('click', addTaskFn);
                input.addEventListener('keydown', e => { if (e.key === 'Enter') addTaskFn(); });
                addRow.appendChild(input);
                addRow.appendChild(addBtn);

                card.appendChild(header);
                card.appendChild(taskList);
                card.appendChild(addRow);
                return card;
            }

            function createTaskItem(catId, task) {
                const li = document.createElement('li');
                li.className = 'task-item' + (task.completed ? ' completed' : '');
                li.setAttribute('data-task-id', task.id);
                li.draggable = true;

                li.addEventListener('dragstart', e => {
                    if (e.target.closest('button, input, textarea, select')) { e.preventDefault(); return; }
                    dragInfo = { type: 'task', taskId: task.id, categoryId: catId };
                    e.dataTransfer.setData('text/plain', 'task');
                    e.dataTransfer.effectAllowed = 'move';
                    li.classList.add('dragging');
                });
                li.addEventListener('dragend', () => {
                    li.classList.remove('dragging');
                    document.querySelectorAll('.drop-target-above, .drop-target-below')
                        .forEach(el => el.classList.remove('drop-target-above', 'drop-target-below'));
                    dragInfo = null;
                });

                const handle = document.createElement('span');
                handle.className = 'drag-handle';
                handle.textContent = '☰';
                handle.title = 'Drag to reorder';

                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.className = 'task-checkbox';
                cb.checked = task.completed;
                cb.addEventListener('change', () => toggleTask(catId, task.id, cb.checked));

                const textSpan = document.createElement('span');
                textSpan.className = 'task-text';
                textSpan.textContent = task.text;

                const editBtn = document.createElement('button');
                editBtn.className = 'icon-btn';
                editBtn.innerHTML = '✎';
                editBtn.title = 'Edit task';
                let editing = false;
                editBtn.addEventListener('click', e => {
                    e.stopPropagation();
                    if (editing) {
                        const input = li.querySelector('.edit-input');
                        if (input) {
                            const val = input.value.trim();
                            if (val) task.text = val;
                            li.replaceChild(textSpan, input);
                            textSpan.textContent = task.text || '(empty)';
                            saveData();
                        }
                        editBtn.innerHTML = '✎';
                        editBtn.classList.remove('save-active');
                        editing = false;
                    } else {
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'edit-input';
                        input.value = task.text;
                        li.replaceChild(input, textSpan);
                        input.focus();
                        editBtn.innerHTML = '💾';
                        editBtn.classList.add('save-active');
                        editing = true;
                        const saveFn = () => {
                            if (editing) {
                                const val = input.value.trim();
                                if (val) task.text = val;
                                li.replaceChild(textSpan, input);
                                textSpan.textContent = task.text || '(empty)';
                                editBtn.innerHTML = '✎';
                                editBtn.classList.remove('save-active');
                                editing = false;
                                saveData();
                            }
                        };
                        input.addEventListener('blur', () => setTimeout(saveFn, 150));
                        input.addEventListener('keydown', ev => {
                            if (ev.key === 'Enter') input.blur();
                            if (ev.key === 'Escape') { input.value = task.text; input.blur(); }
                        });
                    }
                });

                const delBtn = document.createElement('button');
                delBtn.className = 'icon-btn';
                delBtn.innerHTML = '✕';
                delBtn.title = 'Delete task';
                delBtn.addEventListener('click', e => { e.stopPropagation(); deleteTask(catId, task.id); });

                li.appendChild(handle);
                li.appendChild(cb);
                li.appendChild(textSpan);
                li.appendChild(editBtn);
                li.appendChild(delBtn);
                return li;
            }

            document.addEventListener('dragover', e => {
                if (!dragInfo) return;
                if (dragInfo.type === 'task') {
                    const list = e.target.closest('.task-list');
                    if (!list) return;
                    e.preventDefault();
                    document.querySelectorAll('.drop-target-above, .drop-target-below')
                        .forEach(el => el.classList.remove('drop-target-above', 'drop-target-below'));
                    const items = [...list.querySelectorAll(':scope > .task-item:not(.dragging)')];
                    const y = e.clientY;
                    for (let i = 0; i < items.length; i++) {
                        const rect = items[i].getBoundingClientRect();
                        if (y < rect.top + rect.height / 2) {
                            items[i].classList.add('drop-target-above');
                            break;
                        } else if (i === items.length - 1) {
                            items[i].classList.add('drop-target-below');
                        }
                    }
                } else if (dragInfo.type === 'category') {
                    const row = e.target.closest('.categories-row');
                    if (row) e.preventDefault();
                }
            });

            document.addEventListener('drop', e => {
                if (!dragInfo) return;
                if (dragInfo.type === 'task') {
                    const list = e.target.closest('.task-list');
                    if (!list) return;
                    e.preventDefault();
                    const { taskId, categoryId } = dragInfo;
                    const cat = appData.categories.find(c => c.id === categoryId);
                    if (!cat) return;
                    const tasks = cat.tasks;
                    const dragIdx = tasks.findIndex(t => t.id === taskId);
                    if (dragIdx === -1) return;
                    const items = [...list.querySelectorAll(':scope > .task-item:not(.dragging)')];
                    let insertIdx = items.length;
                    const y = e.clientY;
                    for (let i = 0; i < items.length; i++) {
                        const rect = items[i].getBoundingClientRect();
                        if (y < rect.top + rect.height / 2) { insertIdx = i; break; }
                    }
                    if (dragIdx < insertIdx) insertIdx--;
                    const [moved] = tasks.splice(dragIdx, 1);
                    tasks.splice(insertIdx, 0, moved);
                    saveData();
                    renderAll();
                    dragInfo = null;
                    document.querySelectorAll('.drop-target-above, .drop-target-below')
                        .forEach(el => el.classList.remove('drop-target-above', 'drop-target-below'));
                } else if (dragInfo.type === 'category') {
                    const row = e.target.closest('.categories-row');
                    if (!row) return;
                    e.preventDefault();
                    const freq = dragInfo.frequency;
                    const draggedId = dragInfo.categoryId;
                    const cats = getCategoriesByFrequency(freq);
                    const dragIdx = cats.findIndex(c => c.id === draggedId);
                    if (dragIdx === -1) return;
                    const cards = [...row.querySelectorAll(':scope > .category-card')];
                    let insertIdx = cards.length;
                    const x = e.clientX;
                    for (let i = 0; i < cards.length; i++) {
                        const rect = cards[i].getBoundingClientRect();
                        if (x < rect.left + rect.width / 2) { insertIdx = i; break; }
                    }
                    if (dragIdx < insertIdx) insertIdx--;
                    const [moved] = cats.splice(dragIdx, 1);
                    cats.splice(insertIdx, 0, moved);
                    const newOrder = [];
                    frequencies.forEach(f => {
                        if (f === freq) newOrder.push(...cats);
                        else newOrder.push(...appData.categories.filter(c => c.frequency === f));
                    });
                    appData.categories = newOrder;
                    saveData();
                    renderAll();
                    dragInfo = null;
                }
            });

            window.addCategory = (name, freq) => {
                appData.categories.push({ id: genId(), name: name.trim(), frequency: freq, tasks: [] });
                saveData();
                renderAll();
                showToast('✅ Category created!');
            };
            window.deleteCategory = id => {
                const cat = appData.categories.find(c => c.id === id);
                if (!cat || !confirm(`Delete "${cat.name}"?`)) return;
                appData.categories = appData.categories.filter(c => c.id !== id);
                saveData();
                renderAll();
                showToast('🗑️ Category deleted.');
            };
            window.addTask = (catId, text) => {
                const cat = appData.categories.find(c => c.id === catId);
                if (!cat) return;
                cat.tasks.push({ id: genId(), text: text.trim(), completed: false });
                saveData();
                renderAll();
            };
            window.deleteTask = (catId, taskId) => {
                const cat = appData.categories.find(c => c.id === catId);
                if (!cat) return;
                cat.tasks = cat.tasks.filter(t => t.id !== taskId);
                saveData();
                renderAll();
            };
            window.toggleTask = (catId, taskId, completed) => {
                const cat = appData.categories.find(c => c.id === catId);
                if (!cat) return;
                const task = cat.tasks.find(t => t.id === taskId);
                if (task) { task.completed = completed; saveData(); renderAll(); }
            };

            window.resetByFrequency = freq => {
                const cats = appData.categories.filter(c => c.frequency === freq);
                let count = 0;
                cats.forEach(c => c.tasks.forEach(t => { if (t.completed) { t.completed = false; count++; } }));
                if (count === 0) { showToast('No completed tasks.'); return; }
                if (!confirm(`Uncheck all ${freq} tasks?`)) return;
                saveData();
                renderAll();
                showToast('🔄 Reset done.');
            };
            window.clearFrequency = freq => {
                const cats = appData.categories.filter(c => c.frequency === freq);
                if (cats.length === 0) { showToast(`No ${freq} categories.`); return; }
                if (!confirm(`Delete all ${freq} categories?`)) return;
                appData.categories = appData.categories.filter(c => c.frequency !== freq);
                saveData();
                renderAll();
                showToast('🗑️ Cleared.');
            };
            window.clearAllData = () => {
                if (appData.categories.length === 0) { showToast('Nothing to clear.'); return; }
                if (!confirm('DELETE EVERYTHING?')) return;
                appData.categories = [];
                saveData();
                renderAll();
                showToast('🗑️ All cleared.');
            };
            window.backupData = () => {
                const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `checklist-backup-${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.json`;
                a.click();
                showToast('💾 Backup downloaded!');
            };
            window.restoreData = event => {
                const file = event.target.files[0];
                if (!file) return;
                if (!confirm('Replace all data with backup?')) { event.target.value = ''; return; }
                const reader = new FileReader();
                reader.onload = e => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (!parsed?.categories) throw new Error('Invalid');
                        appData = parsed;
                        saveData();
                        renderAll();
                        showToast('📤 Restored!');
                        closeSettingsModal();
                    } catch (err) { showToast('⚠️ Invalid backup file.'); }
                };
                reader.readAsText(file);
                event.target.value = '';
            };

            window.openAddCategoryModal = () => {
                document.getElementById('catNameInput').value = '';
                document.getElementById('catFrequencySelect').value = 'daily';
                document.getElementById('addCategoryModalOverlay').classList.add('active');
            };
            window.openAddCategoryWithFreq = freq => {
                document.getElementById('catNameInput').value = '';
                document.getElementById('catFrequencySelect').value = freq;
                document.getElementById('addCategoryModalOverlay').classList.add('active');
            };
            window.closeAddCategoryModal = () => document.getElementById('addCategoryModalOverlay').classList.remove('active');
            window.confirmAddCategory = () => {
                const name = document.getElementById('catNameInput').value.trim();
                const freq = document.getElementById('catFrequencySelect').value;
                if (!name) { showToast('Enter a name'); return; }
                addCategory(name, freq);
                closeAddCategoryModal();
            };
            window.openSettingsModal = () => {
                document.getElementById('settingsModalOverlay').classList.add('active');
                document.getElementById('darkModeCheckbox').checked = document.documentElement.classList.contains('dark-mode');
            };
            window.closeSettingsModal = () => document.getElementById('settingsModalOverlay').classList.remove('active');
            window.toggleDarkMode = enable => {
                if (enable) {
                    document.documentElement.classList.add('dark-mode');
                    localStorage.setItem(DARK_MODE_KEY, 'true');
                } else {
                    document.documentElement.classList.remove('dark-mode');
                    localStorage.setItem(DARK_MODE_KEY, 'false');
                }
            };

            if (localStorage.getItem(DARK_MODE_KEY) === 'true') {
                document.documentElement.classList.add('dark-mode');
            }
            document.getElementById('addCategoryModalOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeAddCategoryModal(); });
            document.getElementById('settingsModalOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeSettingsModal(); });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    if (document.getElementById('settingsModalOverlay').classList.contains('active')) closeSettingsModal();
                    else if (document.getElementById('addCategoryModalOverlay').classList.contains('active')) closeAddCategoryModal();
                }
            });

            loadData();
            renderAll();
        })();
    </script>
</body>
</html>
